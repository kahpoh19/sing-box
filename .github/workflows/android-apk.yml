name: Build MatchaProxy Android APKs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matchaproxy-android-release
  cancel-in-progress: false

env:
  BUILD_VERSION: "1.13.14-matchaproxy.2"
  VERSION_CODE: "1131402"
  CORE_COMMIT: "25a600db24f7680ad9806ce5427bd0ab8afe1114"
  ANDROID_COMMIT: "aa686b2f1ac4ca9e888d4d068ce79ee1abd309fc"
  EXPECTED_CERT_SHA256: "0451ae93e6dfd6d275f17cec3720c69445e7fe8ecb9e5c97b9da82d49ce68cf5"

jobs:
  android-release:
    name: Signed MatchaProxy Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout release automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout exact upstream core
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.CORE_COMMIT }}
          path: core
          fetch-depth: 1
          submodules: false

      - name: Checkout exact upstream Android source
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box-for-android
          ref: ${{ env.ANDROID_COMMIT }}
          path: core/clients/android
          fetch-depth: 1
          submodules: recursive

      - name: Verify sources and apply MatchaProxy patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_COMMIT"
          test "$(git -C core/clients/android rev-parse HEAD)" = "$ANDROID_COMMIT"
          patch_file="$GITHUB_WORKSPACE/automation/.github/patches/matchaproxy-android.patch"
          git -C core/clients/android apply --check "$patch_file"
          git -C core/clients/android apply "$patch_file"
          git -C core/clients/android diff --check
          grep -F 'applicationId = "io.github.kahpoh19.matchaproxy"' core/clients/android/app/build.gradle.kts
          grep -F 'base.archivesName.set("MatchaProxy-${versionName}")' core/clients/android/app/build.gradle.kts
          grep -F 'isUniversalApk = false' core/clients/android/app/build.gradle.kts
          test -s core/clients/android/app/src/main/res/drawable-nodpi/ic_matchaproxy_adaptive_foreground.png

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: core/clients/android/**/*.gradle*

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > core/clients/android/app/release.keystore
          chmod 600 core/clients/android/app/release.keystore

      - name: Set deterministic application version
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_VERSION" = "1.13.14-matchaproxy.2"
          git -C core tag -f "v${BUILD_VERSION}" "$CORE_COMMIT"
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${BUILD_VERSION}/" core/clients/android/version.properties
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${VERSION_CODE}/" core/clients/android/version.properties
          grep -Fx "VERSION_NAME=${BUILD_VERSION}" core/clients/android/version.properties
          grep -Fx "VERSION_CODE=${VERSION_CODE}" core/clients/android/version.properties

      - name: Build Android libbox
        shell: bash
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
          mkdir -p clients/android/app/libs
          cp libbox.aar clients/android/app/libs/

      - name: Build signed release APKs
        shell: bash
        working-directory: core/clients/android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -z "$LOCAL_PROPERTIES" ]; then
            echo "LOCAL_PROPERTIES secret is missing" >&2
            exit 1
          fi
          ./gradlew :app:assembleOtherRelease --no-daemon

      - name: Collect and verify four ABI APKs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          abis=(armeabi-v7a arm64-v8a x86 x86_64)
          for abi in "${abis[@]}"; do
            matches=(core/clients/android/app/build/outputs/apk/other/release/*-"${abi}".apk)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one APK for ${abi}, found ${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" dist/
          done

          apks=(dist/*.apk)
          if [ "${#apks[@]}" -ne 4 ]; then
            echo "Expected exactly four APKs, found ${#apks[@]}" >&2
            exit 1
          fi
          if compgen -G 'dist/*universal*.apk' > /dev/null; then
            echo "Universal APK must not be published" >&2
            exit 1
          fi
          if compgen -G 'dist/*legacy-android-5*.apk' > /dev/null; then
            echo "Android 5 legacy APK must not be published" >&2
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose "$apk"
            cert_digest=$("$APKSIGNER" verify --print-certs "$apk" |
              sed -n 's/^.*certificate SHA-256 digest: //p' |
              tr '[:upper:]' '[:lower:]' |
              sort -u)
            if [ "$cert_digest" != "$EXPECTED_CERT_SHA256" ]; then
              echo "Unexpected signing certificate for $apk: $cert_digest" >&2
              exit 1
            fi
          done
          ls -lh dist/*.apk

      - name: Create updater metadata
        shell: bash
        run: |
          set -euo pipefail
          printf '{\n  "version_code": %s,\n  "version_name": "%s"\n}\n' \
            "$VERSION_CODE" "$BUILD_VERSION" > dist/MatchaProxy-version-metadata.json

      - name: Create complete corresponding source archive
        shell: bash
        run: |
          set -euo pipefail
          source_root="MatchaProxy-${BUILD_VERSION}-source"
          bundle_root="source-stage/${source_root}"
          mkdir -p "$bundle_root/core/clients/android" "$bundle_root/automation" "$bundle_root/assets"

          git -C core archive --format=tar "$CORE_COMMIT" |
            tar -xf - -C "$bundle_root/core"
          git -C core/clients/android archive --format=tar "$ANDROID_COMMIT" |
            tar -xf - -C "$bundle_root/core/clients/android"

          (
            cd "$bundle_root/core/clients/android"
            git apply --no-index "$GITHUB_WORKSPACE/automation/.github/patches/matchaproxy-android.patch"
          )

          cp automation/.github/workflows/android-apk.yml "$bundle_root/automation/android-apk.yml"
          cp automation/.github/patches/matchaproxy-android.patch "$bundle_root/automation/"
          cp automation/.github/assets/matchaproxy-icon-source.png "$bundle_root/assets/"
          cp automation/.github/assets/matchaproxy-icon-launcher.png "$bundle_root/assets/"
          cp automation/MODIFICATIONS.md "$bundle_root/"
          cp automation/SOURCE_INFO.md "$bundle_root/"

          upstream_keystore_sha=$(git -C core/clients/android show \
            "${ANDROID_COMMIT}:app/release.keystore" | sha256sum | cut -d ' ' -f 1)
          bundled_keystore_sha=$(sha256sum \
            "$bundle_root/core/clients/android/app/release.keystore" | cut -d ' ' -f 1)
          if [ "$bundled_keystore_sha" != "$upstream_keystore_sha" ]; then
            echo "Bundled upstream keystore does not match the pinned source commit" >&2
            exit 1
          fi

          if find "$bundle_root" -type f \( \
            -name 'local.properties' -o \
            -name 'libbox.aar' \
          \) -print -quit | grep -q .; then
            echo "Sensitive or generated build material found in source bundle" >&2
            exit 1
          fi
          if find "$bundle_root" -type d -name .git | grep -q .; then
            echo ".git directory found in source bundle" >&2
            exit 1
          fi

          tar -C source-stage -czf "dist/MatchaProxy-${BUILD_VERSION}-source.tar.gz" "$source_root"
          tar -tzf "dist/MatchaProxy-${BUILD_VERSION}-source.tar.gz" | grep -F "/core/clients/android/app/build.gradle.kts"
          tar -tzf "dist/MatchaProxy-${BUILD_VERSION}-source.tar.gz" | grep -F "/assets/matchaproxy-icon-source.png"
          tar -tzf "dist/MatchaProxy-${BUILD_VERSION}-source.tar.gz" | grep -F "/MODIFICATIONS.md"

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum ./*.apk ./MatchaProxy-version-metadata.json ./*-source.tar.gz > SHA256SUMS
          )
          cat dist/SHA256SUMS

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: matchaproxy-release-${{ env.BUILD_VERSION }}
          if-no-files-found: error
          retention-days: 30
          path: dist/*

      - name: Publish stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${BUILD_VERSION}"
          cat > release-notes.md <<'EOF'
          MatchaProxy is an unofficial, independently branded derivative. It is not affiliated with, sponsored by, or endorsed by SagerNet.

          Source basis:
          - sing-box core v1.13.14: 25a600db24f7680ad9806ce5427bd0ab8afe1114
          - Android client: aa686b2f1ac4ca9e888d4d068ce79ee1abd309fc

          Modifications dated 2026-07-16 include the independent MatchaProxy name, package ID, original matcha-cake icon artwork with balanced adaptive-icon safe-area spacing, deep-link namespace, updater endpoint and ABI selection, plus removal of universal and Android 5 legacy APK outputs. Four signed split APKs are provided: arm64-v8a, armeabi-v7a, x86_64, and x86. Minimum Android version: 6.0 (API 23).

          Licensed under GPL-3.0-or-later. The attached MatchaProxy-1.13.14-matchaproxy.2-source.tar.gz is the complete corresponding source for these APKs and includes the exact build workflow, modification patch, icon source artwork, notices, upstream core source, and patched Android source. Verify downloads with SHA256SUMS.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "MatchaProxy ${BUILD_VERSION}" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "MatchaProxy ${BUILD_VERSION}" \
              --notes-file release-notes.md
          fi

      - name: Remove restored signing key
        if: always()
        shell: bash
        run: rm -f core/clients/android/app/release.keystore
